<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register - Borgu Security Incident Reporting System
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="login-container">

        <div class="login-box">

            <h1>
                Create Account
            </h1>

            <h2>
                Borgu Security Incident Reporting System
            </h2>

            <p class="login-subtitle">
                Register to report security incidents
            </p>


            <form id="registerForm">


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Register
                </button>


            </form>


            <p class="register-link">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>


            <p class="home-link">

                <a href="index.html">
                    ← Back to Home
                </a>

            </p>


        </div>

    </div>


    <!-- FRONTEND JAVASCRIPT -->

    <script src="app.js"></script>

</body>

</html>
